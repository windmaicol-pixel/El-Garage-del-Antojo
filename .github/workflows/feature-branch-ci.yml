name: Feature Branch CI

on:
  push:
    branches: [ 'feature/*' ]
  pull_request:
    branches: [ development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    name: Validate Feature Branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if branch is up to date with development
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin development
          BEHIND=$(git rev-list --count HEAD..origin/development)
          if [ $BEHIND -gt 0 ]; then
            echo "⚠️ Branch is $BEHIND commits behind development"
            echo "Please update your branch: git pull origin development"
          else
            echo "✅ Branch is up to date with development"
          fi
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Create fake google-services.json for CI
        run: |
          cp androidApp/google-services-fake.json androidApp/google-services.json
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Kotlin linter
        run: ./gradlew ktlintCheck
      
      - name: Run Unit Tests
        run: |
          ./gradlew shared:testDebugUnitTest
          ./gradlew androidApp:testDebugUnitTest
      
      - name: Build Shared Module
        run: ./gradlew shared:assembleDebug
      
      - name: Build Android App
        run: ./gradlew androidApp:assembleDebug
      
      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Feature Branch Validation**\n\n- Linter: Passed\n- Tests: Passed\n- Build: Passed\n\nReady to merge into development!`
            })
